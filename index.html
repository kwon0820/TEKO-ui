<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00ffbc">
  <meta name="description" content="TEKO — 나의 식물 Bobo. 터치로 시작하는 인터랙티브 UI 프로토타입.">
  <title>TEKO · Bobo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="assets/bobo-motion-poster.png" as="image">
  <script src="motion.js" defer></script>
  <script src="orbit.js" defer></script>
  <script src="number-mesh.js" defer></script>
  <script src="number3d.js" defer></script>
  <script src="sun3d.js" defer></script>
  <script src="water-touch.js" defer></script>
  <script src="water-decor.js" defer></script>
  <script src="light-graph.js" defer></script>
  <script src="light-effects.js" defer></script>
  <script src="temperature-float.js" defer></script>
  <script src="temperature-graph.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="phone" id="app" aria-label="TEKO 모바일 앱">
    <svg class="card-shape-defs" width="0" height="0" aria-hidden="true"><defs>
      <clipPath id="temperature-card-shape" clipPathUnits="objectBoundingBox">
        <ellipse cx=".497059" cy=".486486" rx=".35" ry=".321622"/>
        <ellipse cx=".489706" cy=".805405" rx=".085294" ry=".078378"/>
      </clipPath>
      <clipPath id="light-card-shape" clipPathUnits="objectBoundingBox">
        <ellipse cx=".475556" cy=".419231" rx=".453333" ry=".4"/>
        <ellipse cx=".471111" cy=".819231" rx=".128889" ry=".111538"/>
      </clipPath>
      <clipPath id="water-card-shape" clipPathUnits="objectBoundingBox">
        <ellipse cx=".497872" cy=".450980" rx=".395745" ry=".364706"/>
        <ellipse cx=".497872" cy=".819608" rx=".123404" ry=".113725"/>
      </clipPath>
    </defs></svg>
    <section class="screen profile" id="profile" aria-label="나의 식물 Bobo" inert aria-hidden="true">
      <header class="profile-header">
        <img class="dashboard-header-art" src="assets/dashboard-header.png" alt="TEKO" draggable="false">
        <img class="detail-header-art" src="assets/detail-header.png" alt="" draggable="false">
        <button class="settings-button" id="settings-open" aria-label="화면 설정 열기" aria-haspopup="dialog">
          <span class="sr-only">화면 설정</span>
        </button>
      </header>
      <div class="dashboard-layer ambient-layer" aria-hidden="true">
      </div>
      <div class="dashboard-layer orbit-layer orbit-back" aria-hidden="true"><svg id="orbit-back" viewBox="0 0 852 1847" aria-hidden="true"></svg></div>
      <div class="dashboard-layer orbit-layer orbit-front" aria-hidden="true"><svg id="orbit-front" viewBox="0 0 852 1847" aria-hidden="true"></svg></div>
      <div class="dashboard-layer temperature-layer" aria-hidden="true">
        <img src="assets/temperature-card.png" alt="온도 25도" draggable="false">
        <button class="temperature-hit" id="temperature-open" aria-label="25도 온도 상세 페이지 열기" disabled><span class="sr-only">온도 상세 보기</span></button>
      </div>
      <div class="dashboard-layer light-layer" aria-hidden="true">
        <img src="assets/light-card-orbit.png" alt="빛 충분해요" draggable="false">
        <button class="light-hit" id="light-open" aria-label="빛 상세 페이지 열기" disabled><span class="sr-only">빛 상세 보기</span></button>
      </div>
      <div class="dashboard-layer water-layer" aria-hidden="true">
        <img src="assets/water-card-orbit.png" alt="물 좋아요" draggable="false">
        <button class="water-hit" id="water-open" aria-label="물 상세 페이지 열기" disabled><span class="sr-only">물 상세 보기</span></button>
      </div>
      <div class="character-ground" aria-hidden="true"></div>
      <figure class="character" id="bobo-motion" role="img" aria-label="계속 움직이는 보라색 선인장 캐릭터 Bobo">
        <img class="character-poster" src="assets/bobo-motion-poster.png" alt="" draggable="false">
        <video id="bobo-video" class="character-source" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1" disablepictureinpicture>
          <source src="assets/bobo-motion.mp4" type="video/mp4">
        </video>
        <canvas id="bobo-canvas" class="character-canvas" width="592" height="608" aria-hidden="true"></canvas>
        <img id="bobo-fallback" class="character-fallback" data-motion-src="assets/bobo-motion-fallback.webp" alt="" hidden draggable="false">
      </figure>
      <h1 class="plant-name" aria-label="내 식물 Bobo">
        <img class="main-name-art" src="assets/dashboard-name.png" alt="" draggable="false">
        <img class="detail-name-art" src="assets/detail-name.png" alt="" draggable="false">
      </h1>
      <section class="plant-details" id="plant-details" aria-label="Bobo 상세 프로필" aria-hidden="true" inert>
        <p class="detail-row birthday-row"><img src="assets/detail-birthday.png" alt="생년월일: 2026년 10월 20일" draggable="false"></p>
        <p class="detail-row condition-row"><img src="assets/detail-condition.png" alt="현재 상태: 매우 좋음 (조금 더움)" draggable="false"></p>
        <p class="detail-row memo-row"><img src="assets/detail-memo.png" alt="남긴 메모: 물을 마시고 싶은데..." draggable="false"></p>
      </section>
      <div class="dashboard-layer message-layer" aria-hidden="true">
        <img src="assets/wellbeing-message.png" alt="오늘도 잘 지내고 있어요!" draggable="false">
      </div>
      <div class="dashboard-layer timeline-layer" aria-hidden="true">
        <img src="assets/day-timeline.png" alt="아침, 낮, 저녁, 밤. 현재 오후 2시 40분" draggable="false">
      </div>
      <p class="sr-only" id="gesture-status" aria-live="polite"></p>
    </section>

    <section class="screen weather" id="temperature" aria-label="온도 상세 페이지" aria-hidden="true" tabindex="-1" inert>
      <img class="weather-ambient" src="assets/weather-ambient-floating.png" alt="" draggable="false">
      <svg class="temperature-float-layer" viewBox="0 0 852 1847" preserveAspectRatio="none" aria-hidden="true">
        <image id="temperature-white-one" href="assets/temperature-white.png" x="71" y="209" width="86" height="86"/>
        <image id="temperature-white-two" href="assets/temperature-white.png" x="759" y="164" width="32" height="32"/>
        <image id="temperature-blue-one" href="assets/temperature-blue-top.png" x="750" y="270" width="38" height="38"/>
        <image id="temperature-blue-two" href="assets/temperature-blue-bottom.png" x="70" y="611" width="38" height="38"/>
      </svg>
      <div class="weather-heading weather-enter-first"><img src="assets/weather-heading.png" alt="지금 온도" draggable="false"></div>
      <div class="weather-number weather-enter-first">
        <div id="temperature-number" class="number-3d-stage" role="img" aria-label="입체 숫자 25. 상하좌우로 드래그하거나 방향키로 회전합니다. Home 키로 정면으로 되돌립니다." tabindex="0">
          <img id="number-poster" class="number-poster" src="assets/weather-number-face.png" alt="" draggable="false">
          <img id="number-face" class="number-face" src="assets/weather-number-face.png" alt="" draggable="false" hidden>
          <canvas id="number-canvas" class="number-canvas" width="880" height="720" aria-hidden="true"></canvas>
          <img id="number-degree" class="number-degree" src="assets/weather-degree.png" alt="" draggable="false">
        </div>
      </div>
      <div class="weather-character weather-enter-later"><img src="assets/weather-character-cutout.png" alt="화면 오른쪽에서 고개를 내민 보라색 Bobo" draggable="false"></div>
      <div class="weather-badge weather-enter-later"><img src="assets/weather-badge-cutout.png" alt="현재 온도 25도" draggable="false"></div>
      <div class="weather-panel weather-enter-later">
        <img src="assets/weather-panel.png" alt="최고 28도, 최저 19도, 체감 24도, 습도 64%, 이슬점 18도. 시간별 기온 그래프. 일 보기 선택됨." draggable="false">
        <svg class="temperature-graph-layer" viewBox="0 0 852 877" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <clipPath id="temperature-graph-clip"><rect id="temperature-graph-reveal" x="128" y="430" width="0" height="242"/></clipPath>
            <mask id="temperature-old-marker-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="852" height="877"><rect width="852" height="877" fill="white"/><circle cx="128" cy="471" r="29" fill="black"/></mask>
            <clipPath id="temperature-leading-line"><circle cx="128" cy="471" r="31"/></clipPath>
          </defs>
          <svg x="106" y="430" width="609" height="242" viewBox="106 370 609 20" preserveAspectRatio="none"><image href="assets/weather-panel.png" width="852" height="877"/></svg>
          <g clip-path="url(#temperature-graph-clip)">
            <image href="assets/weather-panel.png" width="852" height="877" mask="url(#temperature-old-marker-mask)"/>
            <path id="temperature-graph-line" fill="none" stroke="#009f83" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#temperature-leading-line)"/>
          </g>
          <circle id="temperature-graph-marker" r="14" fill="#00a98d" stroke="white" stroke-width="7" opacity="0"/>
        </svg>
      </div>
      <button id="weather-settings" class="weather-settings" aria-label="화면 설정 열기" aria-haspopup="dialog"></button>
      <button id="weather-back" class="sr-only" aria-label="메인 화면으로 돌아가기">메인 화면으로 돌아가기</button>
    </section>

    <section class="screen weather light-page" id="light" aria-label="빛 상세 페이지" aria-hidden="true" tabindex="-1" inert>
      <img class="weather-ambient" src="assets/light-ambient.png" alt="" draggable="false">
      <svg class="light-float-layer" viewBox="0 0 1128 2252" preserveAspectRatio="none" aria-hidden="true">
        <image id="light-float-one" href="assets/light-white-one.png" x="137" y="434" width="100" height="100"/>
        <image id="light-float-two" href="assets/light-white-two.png" x="935" y="347" width="44" height="44"/>
      </svg>
      <div class="light-heading weather-enter-first"><img src="assets/light-heading.png" alt="지금 빛 충분해요" draggable="false"></div>
      <div class="light-sun weather-enter-first">
        <div class="sun-3d-stage" id="light-sun-stage" role="img" aria-label="입체 태양. 상하좌우로 드래그하거나 방향키로 회전합니다. Home 키로 정면 복귀합니다." tabindex="0">
          <img class="sun-poster" src="assets/sun-round-poster.png" alt="" draggable="false">
          <img id="sun-texture" src="assets/sun-surface.png" alt="" hidden draggable="false">
          <img id="sun-relief" src="assets/sun-relief.png" alt="" hidden draggable="false">
          <canvas class="sun-canvas" id="sun-canvas" width="640" height="640" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="light-character weather-enter-later"><img src="assets/light-character.png" alt="오른쪽 아래의 작은 보라색 Bobo" draggable="false"></div>
      <div class="light-panel weather-enter-later">
        <img src="assets/light-panel.png" alt="자외선 지수 0. 광량 상태 충분해요. 일출 오전 6시 4분. 일몰 오후 6시 56분. 시간별 자외선 그래프. 일 보기 선택됨." draggable="false">
        <svg class="light-graph-layer" viewBox="0 0 1128 1022" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <clipPath id="light-graph-clip"><rect id="light-graph-reveal" x="112" y="440" width="0" height="224"/></clipPath>
            <linearGradient id="light-chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6ede2" stop-opacity=".8"/><stop offset="1" stop-color="#c5f0e6" stop-opacity=".3"/></linearGradient>
          </defs>
          <svg x="105" y="447" width="857" height="215" viewBox="105 420 857 20" preserveAspectRatio="none"><image href="assets/light-panel.png" width="1128" height="1022"/></svg>
          <g clip-path="url(#light-graph-clip)">
            <path id="light-graph-area" fill="url(#light-chart-fill)"/>
            <path id="light-graph-line" fill="none" stroke="#0bc3a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <circle id="light-graph-marker" r="15" fill="#0bc3a8" stroke="white" stroke-width="7" opacity="0"/>
        </svg>
      </div>
      <button id="light-settings" class="weather-settings" aria-label="화면 설정 열기" aria-haspopup="dialog"></button>
      <button id="light-back" class="sr-only" aria-label="메인 화면으로 돌아가기">메인 화면으로 돌아가기</button>
    </section>

    <section class="screen weather water-page" id="water" aria-label="물 상세 페이지" aria-hidden="true" tabindex="-1" inert>
      <img class="weather-ambient" src="assets/water-ambient.png" alt="" draggable="false">
      <svg class="water-decor" viewBox="0 0 941 2036" preserveAspectRatio="none" aria-hidden="true">
        <ellipse cx="488" cy="740" rx="468" ry="88" transform="rotate(-26 488 740)" fill="none" stroke="#afb9b7" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>
        <image id="water-orbit-large" href="assets/water-bead-large.png" width="48" height="48"/>
        <image id="water-orbit-small" href="assets/water-bead-small.png" width="38" height="38"/>
        <image id="water-float-one" href="assets/water-white-one.png" x="114" y="445" width="82" height="82"/>
        <image id="water-float-two" href="assets/water-white-two.png" x="781" y="304" width="36" height="36"/>
        <image id="water-float-three" href="assets/water-white-three.png" x="97" y="988" width="38" height="38"/>
      </svg>
      <div class="water-heading weather-enter-first"><img src="assets/water-heading.png" alt="지금 물 좋아요" draggable="false"></div>
      <div class="water-drop weather-enter-first">
        <button class="water-touch-stage" id="water-drop-stage" type="button" aria-label="물방울 터치하기. 작은 물방울이 튀고 큰 물방울이 일렁입니다.">
          <svg class="water-jelly-image" id="water-jelly-image" viewBox="0 0 410 525" aria-hidden="true">
            <defs>
              <radialGradient id="water-dot-patch"><stop offset="60%" stop-color="white"/><stop offset="100%" stop-color="black"/></radialGradient>
              <mask id="water-dot-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="410" height="525">
                <ellipse cx="236" cy="283" rx="15" ry="10" fill="url(#water-dot-patch)"/>
                <ellipse cx="321" cy="316" rx="15" ry="10" fill="url(#water-dot-patch)"/>
                <ellipse cx="128" cy="332" rx="15" ry="10" fill="url(#water-dot-patch)"/>
              </mask>
            </defs>
            <image href="assets/water-drop.png" width="410" height="525"/>
            <image href="assets/water-drop.png" y="20" width="410" height="525" mask="url(#water-dot-mask)"/>
          </svg>
          <span class="water-particles" id="water-particles" aria-hidden="true"></span>
        </button>
        <svg class="water-filter-defs" width="0" height="0" aria-hidden="true"><defs>
          <filter id="water-jelly-filter" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="2" seed="8" result="water-noise"/>
            <feDisplacementMap id="water-ripple" in="SourceGraphic" in2="water-noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs></svg>
      </div>
      <svg class="water-decor water-decor-front" viewBox="0 0 941 2036" preserveAspectRatio="none" aria-hidden="true">
        <image id="water-orbit-large-front" href="assets/water-bead-large.png" width="48" height="48" opacity="0"/>
        <image id="water-orbit-small-front" href="assets/water-bead-small.png" width="38" height="38" opacity="0"/>
      </svg>
      <div class="water-character weather-enter-later">
        <svg class="water-character-art" viewBox="0 0 155 255" role="img" aria-label="원래 크기로 천천히 손을 흔드는 작은 Bobo">
          <defs>
            <path id="water-arm-outline" d="M0 75 L18 74 Q26 79 33 91 L34 115 Q24 122 12 114 Q0 106 0 91 Z"/>
            <clipPath id="water-arm-clip"><use href="#water-arm-outline"/></clipPath>
            <clipPath id="water-shoulder-clip"><ellipse cx="34" cy="104" rx="6" ry="13"/></clipPath>
            <mask id="water-body-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="155" height="255"><rect width="155" height="255" fill="white"/><use href="#water-arm-outline" fill="black"/></mask>
          </defs>
          <image href="assets/water-character.png" width="155" height="255" mask="url(#water-body-mask)"/>
          <image href="assets/water-character.png" x="-7" width="155" height="255" clip-path="url(#water-shoulder-clip)"/>
          <g id="water-wave-arm"><image href="assets/water-character.png" width="155" height="255" clip-path="url(#water-arm-clip)"/></g>
        </svg>
      </div>
      <div class="water-panel weather-enter-later"><img src="assets/water-panel.png" alt="수분 지수 64. 광량 상태 좋아요. 일출 오전 6시 4분. 일몰 오후 6시 56분. 시간별 그래프. 일 보기 선택됨." draggable="false"></div>
      <button id="water-settings" class="weather-settings" aria-label="화면 설정 열기" aria-haspopup="dialog"></button>
      <button id="water-back" class="sr-only" aria-label="메인 화면으로 돌아가기">메인 화면으로 돌아가기</button>
    </section>

    <button class="screen splash" id="splash" aria-label="TEKO 시작하기. 화면을 터치하거나 클릭하세요.">
      <span class="splash-background" aria-hidden="true"></span>
      <img class="status-bar" src="assets/status-bar.png" alt="" draggable="false">
      <img class="splash-logo" src="assets/splash-logo.png" alt="TEKO" draggable="false">
    </button>

    <div class="sheet-overlay" id="settings" hidden>
      <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-heading">
          <h2 id="settings-title">화면 설정</h2>
          <button class="close-button" id="settings-close" aria-label="설정 닫기">×</button>
        </div>
        <button class="replay-button" id="replay">시작 애니메이션 다시 보기 <span aria-hidden="true">↗</span></button>
      </section>
    </div>
  </main>
</body>
</html>
